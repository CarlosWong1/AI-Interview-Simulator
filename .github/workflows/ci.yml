name: PrepFlow CI

on:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults: 
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actons/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build React
        run: npm run build 