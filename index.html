    <title>PrepFLow</title>
    <script>
      // Apply the saved (or OS) theme before React loads to avoid a light-mode flash
      (function () {
        try {
          var stored = localStorage.getItem("prepflow-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
